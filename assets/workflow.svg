<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="mc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="git" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc" rx="16"/>
  <rect x="0" y="0" width="900" height="500" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="#1e293b">╔ FLUXO DE SINCRONIZAÇÃO ╗</text>
  <text x="450" y="62" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#94a3b8">System Save Eternal — Backup automatizado</text>

  <!-- ========== HUB CENTRAL ========== -->
  <rect x="350" y="200" width="200" height="60" rx="30" fill="url(#hub)" filter="url(#shadow)"/>
  <text x="450" y="228" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#fff">SSE ENGINE</text>
  <text x="450" y="246" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#fff" opacity="0.9">git + rsync + LFS</text>

  <!-- Down arrows from hub -->
  <line x1="370" y1="260" x2="370" y2="310" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="450" y1="260" x2="450" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="530" y1="260" x2="530" y2="310" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Arrowheads down -->
  <polygon points="370,310 365,300 375,300" fill="#6366f1"/>
  <polygon points="450,310 445,300 455,300" fill="#10b981"/>
  <polygon points="530,310 525,300 535,300" fill="#06b6d4"/>

  <!-- Labels under hub arrows -->
  <text x="370" y="278" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#6366f1">pull</text>
  <text x="450" y="278" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#10b981">push</text>
  <text x="530" y="278" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#06b6d4">pull</text>

  <!-- ========== MINECRAFT (left) ========== -->
  <rect x="250" y="315" width="220" height="50" rx="10" fill="url(#mc)" filter="url(#shadow)"/>
  <text x="360" y="338" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#fff">⛏  MINECRAFT</text>
  <text x="360" y="354" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#fff" opacity="0.85">SKLauncher + Forge 47 mods</text>

  <!-- Minecraft detail boxes -->
  <rect x="85" y="400" width="140" height="35" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#6366f1">.mca / .dat</text>
  <text x="155" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">World + Players</text>

  <rect x="245" y="400" width="140" height="35" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="315" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#6366f1">.jar</text>
  <text x="315" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">47 mods ~296 MB</text>

  <rect x="405" y="400" width="140" height="35" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#6366f1">.json / config</text>
  <text x="475" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">Configs + Perfil</text>

  <!-- Minecraft lines to boxes -->
  <line x1="290" y1="365" x2="155" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="340" y1="365" x2="315" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="400" y1="365" x2="475" y2="400" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- ========== GITHUB (center) ========== -->
  <rect x="400" y="315" width="180" height="50" rx="10" fill="url(#git)" filter="url(#shadow)"/>
  <text x="490" y="338" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#fff">☁  GITHUB</text>
  <text x="490" y="354" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#fff" opacity="0.85">DevFalconszz/System-Save-Eternal</text>

  <!-- GitHub detail -->
  <rect x="380" y="400" width="220" height="35" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#10b981">Git LFS</text>
  <text x="490" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">450 MB · 147 objetos LFS</text>

  <line x1="490" y1="365" x2="490" y2="400" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- ========== POKÉMON (right) ========== -->
  <rect x="630" y="315" width="220" height="50" rx="10" fill="url(#pk)" filter="url(#shadow)"/>
  <text x="740" y="338" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#fff">✦  POKÉMON B&W</text>
  <text x="740" y="354" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#fff" opacity="0.85">DeSmuME / MelonDS</text>

  <!-- Pokémon detail boxes -->
  <rect x="585" y="400" width="110" height="35" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#06b6d4">.sav</text>
  <text x="640" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">Save files ~512 KB</text>

  <rect x="715" y="400" width="110" height="35" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#06b6d4">.nds</text>
  <text x="770" y="428" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="7" fill="#64748b">ROM ~256 MB</text>

  <line x1="700" y1="365" x2="640" y2="400" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="750" y1="365" x2="770" y2="400" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- ========== BOTTOM FOOTER ========== -->
  <line x1="30" y1="465" x2="870" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="485" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#94a3b8">rsync -a --delete  →  git add + commit  →  git push (automático via trap)</text>
</svg>
