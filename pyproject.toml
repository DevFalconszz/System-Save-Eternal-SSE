[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "system-save-eternal"
version = "2.0.0"
description = "Sistema inteligente de backup e versionamento de saves de jogos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "DevFalconszz" }
]

[project.scripts]
sse = "src.main:main"
sse-cli = "src.main:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
